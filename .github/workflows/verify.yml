name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        id: lint
        continue-on-error: true
        run: pnpm lint 2>&1 | tee lint-output.txt
      - name: Publish lint output
        if: steps.lint.outcome == 'failure'
        run: |
          echo "## Lint output" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' lint-output.txt >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: pnpm typecheck 2>&1 | tee typecheck-output.txt
      - name: Publish typecheck output
        if: steps.typecheck.outcome == 'failure'
        run: |
          echo "## Typecheck output" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' typecheck-output.txt >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Test
        run: pnpm test
